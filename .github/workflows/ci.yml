name: KRN CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Typecheck, tests, and eval smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace and toolchain contract
        run: pnpm workspace:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Fallow quality gate
        run: pnpm quality:fallow:ci

      - name: KRN behavior and docs smoke
        run: pnpm eval:krn:smoke

      - name: Committed range whitespace check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "$base_sha" "${{ github.sha }}"

      - name: Working tree whitespace check
        run: git diff --check

  db:
    name: DB readiness and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Keep aligned with compose.yaml; update only with a reviewed DB gate run.
        image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
        env:
          POSTGRES_DB: krn
          POSTGRES_PASSWORD: krn
          POSTGRES_USER: krn
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U krn -d krn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KRN_DATABASE_URL: postgres://krn:krn@localhost:54329/krn
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: DB ready
        run: timeout --signal=TERM --kill-after=10s 120s pnpm db:ready

      - name: Drizzle check
        run: pnpm --filter @krn/db db:check

      - name: DB smoke
        run: pnpm db:smoke

      - name: DB memory governance smoke
        run: pnpm db:smoke:memory-governance

      - name: DB eval feedback persistence smoke
        run: pnpm db:smoke:eval-feedback-persistence

      - name: DB memory loop smoke
        run: pnpm db:smoke:memory-loop

      - name: DB memory search smoke
        run: pnpm db:smoke:memory-search

      - name: DB run show smoke
        run: pnpm db:smoke:run-show

      - name: DB maintenance queue smoke
        run: pnpm db:smoke:maintenance-queue

      - name: DB source graph smoke
        run: pnpm db:smoke:source-graph

      - name: DB product-loop eval
        run: pnpm eval:db

      - name: Committed range whitespace check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "$base_sha" "${{ github.sha }}"

      - name: Working tree whitespace check
        if: ${{ !cancelled() }}
        run: git diff --check

      - name: DB diagnostics after failure
        if: ${{ failure() || cancelled() }}
        run: docker ps -a --no-trunc || true
