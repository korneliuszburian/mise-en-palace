name: KRN CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Typecheck, tests, and eval smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KRN_COMMIT_EVENT: ${{ github.event_name }}
      KRN_COMMIT_BEFORE: ${{ github.event.before }}
      KRN_COMMIT_PR_BASE: ${{ github.event.pull_request.base.sha }}
      KRN_WHITESPACE_EVENT: ${{ github.event_name }}
      KRN_WHITESPACE_BEFORE: ${{ github.event.before }}
      KRN_WHITESPACE_PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Toolchain contract
        run: pnpm toolchain:check -- --allow-missing-rtk
      - name: Node22 type boundary
        run: pnpm node22:type-boundary
      - name: Platform contract
        run: pnpm platform:check
      - name: Workspace contract
        run: pnpm workspace:check
      - name: Fixture contract
        run: pnpm fixtures:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: KRN doctor
        run: pnpm krn doctor
      - name: Fallow changed-files quality gate
        run: pnpm quality:fallow:ci
      - name: Required evals
        run: pnpm eval:required
      - name: Committed whitespace
        run: pnpm check:whitespace:committed
      - name: Git diff whitespace
        run: git diff --check

  db:
    name: DB readiness and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Keep aligned with compose.yaml; update only with a reviewed DB gate run.
        image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
        env:
          POSTGRES_DB: krn
          POSTGRES_PASSWORD: krn
          POSTGRES_USER: krn
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U krn -d krn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KRN_DATABASE_URL: postgres://krn:krn@localhost:54329/krn
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: DB verification profile
        if: ${{ !cancelled() }}
        run: pnpm verify:db

      - name: DB diagnostics after failure
        if: ${{ failure() || cancelled() }}
        run: docker ps -a --no-trunc || true

  macos:
    name: macOS Node22 and disposable Postgres verification
    runs-on: macos-14
    timeout-minutes: 45
    env:
      KRN_DATABASE_URL: postgres://krn:krn@localhost:5432/krn
      KRN_COMMIT_EVENT: ${{ github.event_name }}
      KRN_COMMIT_BEFORE: ${{ github.event.before }}
      KRN_COMMIT_PR_BASE: ${{ github.event.pull_request.base.sha }}
      KRN_WHITESPACE_EVENT: ${{ github.event_name }}
      KRN_WHITESPACE_BEFORE: ${{ github.event.before }}
      KRN_WHITESPACE_PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Install PostgreSQL and pgvector
        run: |
          brew untap aws/tap || true
          brew install postgresql@17 pgvector

      - name: Start disposable PostgreSQL
        run: |
          brew services start postgresql@17
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          until pg_isready -h localhost -p 5432; do sleep 1; done
          createdb -h localhost -U "$USER" krn
          psql -h localhost -d krn -c "CREATE USER krn WITH PASSWORD 'krn' SUPERUSER CREATEDB;" || true
          psql -h localhost -d krn -c "ALTER DATABASE krn OWNER TO krn;"
          psql -h localhost -d krn -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database before fast profile
        run: pnpm db:migrate && pnpm db:ready

      - name: Fast verification profile
        run: pnpm verify:fast

      - name: DB verification profile
        run: pnpm verify:db

      - name: Stop disposable PostgreSQL
        if: ${{ always() }}
        run: brew services stop postgresql@17 || true

  security:
    name: Dependency, secret, and license policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm security:dependency-audit

      - name: Secret policy
        env:
          KRN_COMMIT_EVENT: ${{ github.event_name }}
          KRN_COMMIT_BEFORE: ${{ github.event.before }}
          KRN_COMMIT_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm security:secrets

      - name: License policy
        run: pnpm security:licenses
