services:
  krn-postgres:
    # Internal-alpha development only. Update the digest after a reviewed DB gate run.
    image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
    environment:
      POSTGRES_DB: krn
      POSTGRES_USER: krn
      POSTGRES_PASSWORD: krn
    ports:
      # Override KRN_POSTGRES_BIND_ADDRESS explicitly for deliberate remote/container use.
      - "${KRN_POSTGRES_BIND_ADDRESS:-127.0.0.1}:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krn -d krn"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - krn_postgres_data:/var/lib/postgresql/data

volumes:
  krn_postgres_data:
